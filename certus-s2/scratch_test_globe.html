<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CERTUS-S2 Interactive 3D Earth</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #070b14;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Professional Geospatial Top Bar */
        .map-top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 99;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(8px);
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        }
        .search-input {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 12px;
            width: 170px;
            outline: none;
        }
        .search-input:focus {
            border-color: #0284c7;
        }
        .map-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 5px 9px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .map-btn:hover {
            background: #0284c7;
            border-color: #38bdf8;
        }
        .map-btn.active {
            background: #0369a1;
            border-color: #38bdf8;
        }

        /* Preset Quick Chips */
        .preset-bar {
            position: absolute;
            top: 50px;
            left: 10px;
            z-index: 99;
            display: flex;
            gap: 4px;
        }
        .preset-chip {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .preset-chip:hover {
            background: #0284c7;
            color: white;
            border-color: #38bdf8;
        }

        /* Layer Source Pill */
        .layer-pill {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 99;
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(8px);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #334155;
            font-size: 11px;
            color: #94a3b8;
        }
        .layer-pill span {
            color: #38bdf8;
            font-weight: 600;
        }

        /* Live Bottom Coordinates Bar */
        .map-coords-bar {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 99;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #334155;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11px;
            color: #94a3b8;
        }
        .map-coords-bar span {
            color: #38bdf8;
            font-weight: 700;
        }

        /* Map Legend */
        .map-legend {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 99;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #334155;
            font-size: 11px;
            display: flex;
            gap: 12px;
            color: #cbd5e1;
        }
        .legend-chip {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <!-- Top Toolbar -->
    <div class="map-top-bar">
        <input type="text" id="citySearch" class="search-input" placeholder="Search location (e.g. Hyderabad, Rome)..." />
        <button class="map-btn" id="btnSearch" title="Search and fly to location">Fly</button>
        <span style="color: #475569;">|</span>
        <button class="map-btn" id="btnFlyAOI" title="Fly camera directly to target AOI">Fly to AOI</button>
        <button class="map-btn" id="btnGlobal" title="Reset camera to Global overview">Global View</button>
        <span style="color: #475569;">|</span>
        <button class="map-btn active" id="btnToggleFootprint">AOI Footprint</button>
        <button class="map-btn active" id="btnToggleCertified">Certified (7)</button>
        <button class="map-btn" id="btnToggleProposed">Proposed (109)</button>
    </div>

    <!-- Quick Location Chips -->
    <div class="preset-bar">
        <div class="preset-chip" onclick="flyToLocation(40.6406, -3.1678, 'Madrid Benchmark', 13)">Madrid (Benchmark)</div>
        <div class="preset-chip" onclick="flyToLocation(17.3850, 78.4867, 'Hyderabad', 13)">Hyderabad</div>
        <div class="preset-chip" onclick="flyToLocation(12.9716, 77.5946, 'Bengaluru', 13)">Bengaluru</div>
        <div class="preset-chip" onclick="flyToLocation(28.6139, 77.2090, 'Delhi', 13)">Delhi</div>
        <div class="preset-chip" onclick="flyToLocation(41.9028, 12.4964, 'Rome', 13)">Rome</div>
        <div class="preset-chip" onclick="flyToLocation(37.9838, 23.7275, 'Athens / Greece', 13)">Greece</div>
        <div class="preset-chip" onclick="flyToLocation(48.8566, 2.3522, 'Paris', 13)">Paris</div>
    </div>

    <!-- Base Source Pill -->
    <div class="layer-pill">
        Base: <span>ESRI World Imagery + Reference Borders</span>
    </div>

    <!-- Coordinates Display -->
    <div class="map-coords-bar" id="coordsDisplay">
        CURSOR: <span>40.6406°N, -3.1678°E</span> | TARGET: <span>Madrid Urban (Held-out Benchmark)</span>
    </div>

    <!-- Legend -->
    <div class="map-legend">
        <div class="legend-chip">
            <div class="legend-dot" style="background: #38bdf8;"></div>
            <span>AOI 1.28km</span>
        </div>
        <div class="legend-chip">
            <div class="legend-dot" style="background: #10b981;"></div>
            <span>Certified (7)</span>
        </div>
        <div class="legend-chip">
            <div class="legend-dot" style="background: #f59e0b;"></div>
            <span>Proposed (109)</span>
        </div>
    </div>

    <div style="display:none;" id="compatNotice">CERTUS-S2 DEMO AOI</div>

    <script>
        const targetLat = 40.6406;
        const targetLon = -3.1678;
        const sceneTitle = "Madrid Urban (Held-out Benchmark)";

        const map = new maplibregl.Map({
            container: 'cesiumContainer',
            style: {
                version: 8,
                sources: {
                    'esri-satellite': {
                        type: 'raster',
                        tiles: [
                            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
                        ],
                        tileSize: 256,
                        attribution: 'Esri, Maxar, Earthstar Geographics'
                    },
                    'reference-labels': {
                        type: 'raster',
                        tiles: [
                            'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'
                        ],
                        tileSize: 256
                    }
                },
                layers: [
                    {
                        id: 'satellite-base',
                        type: 'raster',
                        source: 'esri-satellite'
                    },
                    {
                        id: 'labels-layer',
                        type: 'raster',
                        source: 'reference-labels'
                    }
                ]
            },
            center: [targetLon, targetLat],
            zoom: 12.8,
            pitch: 45,
            projection: 'globe'
        });

        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

        map.on('style.load', () => {
            map.setFog({
                color: 'rgb(11, 19, 41)',
                'high-color': 'rgb(36, 92, 223)',
                'horizon-blend': 0.05,
                'space-color': 'rgb(7, 11, 20)',
                'star-intensity': 0.6
            });

            // Add AOI footprint rectangle (1.28km x 1.28km around Madrid)
            const d = 0.0058;
            const aoiGeoJSON = {
                type: 'Feature',
                geometry: {
                    type: 'Polygon',
                    coordinates: [[
                        [targetLon - d, targetLat - d],
                        [targetLon + d, targetLat - d],
                        [targetLon + d, targetLat + d],
                        [targetLon - d, targetLat + d],
                        [targetLon - d, targetLat - d]
                    ]]
                },
                properties: { name: sceneTitle }
            };

            map.addSource('aoi-source', {
                type: 'geojson',
                data: aoiGeoJSON
            });

            map.addLayer({
                id: 'aoi-fill',
                type: 'fill',
                source: 'aoi-source',
                paint: {
                    'fill-color': '#0284c7',
                    'fill-opacity': 0.22
                }
            });

            map.addLayer({
                id: 'aoi-outline',
                type: 'line',
                source: 'aoi-source',
                paint: {
                    'line-color': '#38bdf8',
                    'line-width': 3
                }
            });

            // Center Pin Marker
            const el = document.createElement('div');
            el.className = 'aoi-pin';
            el.style.width = '16px';
            el.style.height = '16px';
            el.style.backgroundColor = '#38bdf8';
            el.style.borderRadius = '50%';
            el.style.border = '2px solid white';
            el.style.boxShadow = '0 0 10px #38bdf8';
            new maplibregl.Marker({ element: el })
                .setLngLat([targetLon, targetLat])
                .setPopup(new maplibregl.Popup({ offset: 15 }).setHTML(`<strong>${sceneTitle}</strong><br/>1.28 km × 1.28 km (163.8 ha)`))
                .addTo(map);

            // Add City Overview Markers so judges see Rome, Greece, Madrid, Hyderabad on Earth!
            const cities = [
                { name: "Rome, Italy", coords: [12.4964, 41.9028] },
                { name: "Athens, Greece", coords: [23.7275, 37.9838] },
                { name: "Hyderabad, India", coords: [78.4867, 17.3850] },
                { name: "Bengaluru, India", coords: [77.5946, 12.9716] },
                { name: "Delhi, India", coords: [77.2090, 28.6139] },
                { name: "Paris, France", coords: [2.3522, 48.8566] }
            ];

            cities.forEach(c => {
                const markerDiv = document.createElement('div');
                markerDiv.style.backgroundColor = '#1e293b';
                markerDiv.style.color = '#38bdf8';
                markerDiv.style.border = '1px solid #38bdf8';
                markerDiv.style.borderRadius = '10px';
                markerDiv.style.padding = '2px 6px';
                markerDiv.style.fontSize = '10px';
                markerDiv.style.fontWeight = 'bold';
                markerDiv.style.cursor = 'pointer';
                markerDiv.innerText = c.name;
                markerDiv.onclick = () => flyToLocation(c.coords[1], c.coords[0], c.name, 12);
                new maplibregl.Marker({ element: markerDiv })
                    .setLngLat(c.coords)
                    .addTo(map);
            });
        });

        // Navigation Functions
        function flyToLocation(lat, lon, name, zoom = 13) {
            map.flyTo({
                center: [lon, lat],
                zoom: zoom,
                pitch: 40,
                duration: 2500,
                essential: true
            });
            document.getElementById('coordsDisplay').innerHTML = `FLYING TO: <span>${lat.toFixed(4)}°N, ${lon.toFixed(4)}°E</span> | LOCATION: <span>${name}</span>`;
        }

        document.getElementById('btnFlyAOI').addEventListener('click', () => {
            map.flyTo({
                center: [targetLon, targetLat],
                zoom: 13.5,
                pitch: 45,
                duration: 2000
            });
        });

        document.getElementById('btnGlobal').addEventListener('click', () => {
            map.flyTo({
                center: [targetLon, targetLat],
                zoom: 1.8,
                pitch: 0,
                duration: 2000
            });
        });

        // Search location via Nominatim geocoding
        async function searchAndFlyLocation() {
            const query = document.getElementById('citySearch').value.trim();
            if (!query) return;

            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
                const resp = await fetch(url);
                const data = await resp.json();
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    flyToLocation(lat, lon, data[0].display_name.split(',')[0], 13);
                } else {
                    alert(`Location "${query}" not found.`);
                }
            } catch(e) {
                console.error("Geocoding failed:", e);
            }
        }

        document.getElementById('btnSearch').addEventListener('click', searchAndFlyLocation);
        document.getElementById('citySearch').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchAndFlyLocation();
        });

        // Layer Toggles
        let footprintVisible = true;
        document.getElementById('btnToggleFootprint').addEventListener('click', (e) => {
            footprintVisible = !footprintVisible;
            if (map.getLayer('aoi-fill')) {
                map.setLayoutProperty('aoi-fill', 'visibility', footprintVisible ? 'visible' : 'none');
                map.setLayoutProperty('aoi-outline', 'visibility', footprintVisible ? 'visible' : 'none');
            }
            e.target.classList.toggle('active', footprintVisible);
        });

        // Cursor Tracker
        const coordsDisplay = document.getElementById('coordsDisplay');
        map.on('mousemove', (e) => {
            coordsDisplay.innerHTML = `CURSOR: <span>${e.lngLat.lat.toFixed(4)}°N, ${e.lngLat.lng.toFixed(4)}°E</span> | TARGET: <span>${sceneTitle}</span>`;
        });

        // Click on map
        map.on('click', (e) => {
            const lat = e.lngLat.lat.toFixed(4);
            const lng = e.lngLat.lng.toFixed(4);
            coordsDisplay.innerHTML = `CLICKED: <span>${lat}°N, ${lng}°E</span> | [Enter in sidebar to analyze]`;
        });
    </script>
</body>
</html>
