<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.120.0/Widgets/widgets.css">
    <style>
        html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
        #debug { position: absolute; top: 10px; left: 10px; color: #38bdf8; background: rgba(15,23,42,0.95); padding: 12px; z-index: 999; font-family: monospace; font-size: 11px; max-width: 800px; max-height: 400px; overflow: auto; border: 1px solid #334155; }
    </style>
    <script>
        window.CESIUM_BASE_URL = "https://cdnjs.cloudflare.com/ajax/libs/cesium/1.120.0/";
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.120.0/Cesium.js"></script>
</head>
<body>
    <div id="debug">Intercepting console.error...</div>
    <div id="cesiumContainer"></div>
    <script>
        const debug = document.getElementById('debug');
        function log(m) { debug.innerHTML += "<br/>" + m; }

        const oldError = console.error;
        console.error = function(...args) {
            oldError.apply(console, args);
            args.forEach(arg => {
                if (arg && typeof arg === 'object') {
                    let s = "ERROR OBJ: " + (arg.message || arg.name || "") + " statusCode: " + arg.statusCode + " url: " + arg.url;
                    if (arg.stack) s += "<br/>STACK: " + arg.stack.substring(0, 300);
                    log("<span style='color:red;'>" + s + "</span>");
                } else {
                    log("<span style='color:red;'>ERROR: " + arg + "</span>");
                }
            });
        };

        Cesium.Ion.defaultAccessToken = "";

        const satProvider = new Cesium.UrlTemplateImageryProvider({
            url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}.jpg',
            maximumLevel: 19
        });

        const viewer = new Cesium.Viewer('cesiumContainer', {
            baseLayer: new Cesium.ImageryLayer(satProvider),
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            infoBox: false,
            selectionIndicator: false,
            navigationHelpButton: false,
            sceneModePicker: false,
            animation: false,
            timeline: false,
            fullscreenButton: false
        });

        log("Viewer created.");
    </script>
</body>
</html>
